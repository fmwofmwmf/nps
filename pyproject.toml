[project]
name = "libuipc-samples"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keyboard>=0.13.5",
    "trimesh[easy]>=4.11.1",
    "matplotlib",
    "scipy",
    "torch>=2.11.0,<2.12.0",
    "meshio>=5.3.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
pypi = ["pyuipc"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
